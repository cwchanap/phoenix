name: Unit tests (GdUnit4)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - run: godot --version
      - name: Resolve Godot executable
        run: echo "GODOT_BIN=$(command -v godot)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb
      - run: ./tools/bootstrap-gdunit.sh
      - name: Run GdUnit4 unit tests
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          ./addons/gdUnit4/runtest.sh -a tests/gdunit -c
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          if-no-files-found: warn
          path: reports
