name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Static check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Unit tests
        run: bun run test
      - name: Unit test coverage
        run: bun run test:coverage
      - name: Enforce coverage threshold
        run: bun run coverage:check
      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7
      - name: Upload coverage to Codecov
        if: success()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          disable_search: true
          flags: unit
          fail_ci_if_error: false
      - name: Install Chromium
        run: bun run test:e2e:install:ci
      - name: Browser E2E
        run: bun run test:e2e
      - name: Frontend build
        run: bun run build
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  tauri-build:
    name: Tauri build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Build unsigned macOS bundle
        run: bun run tauri:build -- --no-sign
      - name: Upload unsigned bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: phoenix-macos-unsigned
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
